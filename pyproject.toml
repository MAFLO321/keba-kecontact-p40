[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "keba-kecontact-p40"
version = "0.1.0"
description = "Async client library for the KEBA P40 / P40 Pro wallbox local REST API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Luca Postiglione" }]
keywords = ["keba", "p40", "wallbox", "ev", "home-assistant"]
dependencies = ["aiohttp>=3.9"]

[project.urls]
Homepage = "https://github.com/lpostiglione/keba-kecontact-p40"
Issues = "https://github.com/lpostiglione/keba-kecontact-p40/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "aioresponses>=0.7.6", "mypy>=1.10", "ruff>=0.5"]

[tool.setuptools.package-data]
keba_kecontact_p40 = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]
